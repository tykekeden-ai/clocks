<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>時計</title>
<link rel="stylesheet" href="style.css">
<style>
.timer-wheels {
    display: flex !important;
    flex-direction: row !important;
    align-items: center;
    justify-content: center;
    gap: 5px;
}

.timer-unit {
    display: flex;
    flex-direction: column;
    align-items: center;
}

.timer-unit select {
    width: 60px;
    height: 35px;
    font-size: 18px;
}

.timer-unit span {
    font-size: 12px;
}

.timer-colon {
    font-size: 20px;
    margin-bottom: 18px;
}


/* =========================
   ⏱️ ストップウォッチ
========================= */

#stopwatch {
    text-align: center;
    margin-top: 20px;
}

#stopwatch-display {
    font-size: 48px;
    font-family: monospace;
    font-weight: bold;
    letter-spacing: 2px;
    margin: 15px 0;
}

#stopwatch-controls {
    display: flex;
    justify-content: center;
    gap: 10px;
    flex-wrap: wrap;
}

#stopwatch-controls button {
    font-size: 16px;
    padding: 8px 16px;
    cursor: pointer;
}
</style>

</head>

<body>

    <h1>時計</h1>

    <!-- 時計の表示方式 -->
<!-- ⚙️ 設定 -->
<section id="settings">

    <h2>⚙️ 設定</h2>

    <button id="settings-items">
        項目変更
    </button>

    <div id="settings-panel" hidden>

        <!-- 時計の表示方式 -->
        <h3>⌚ 時計の表示方式</h3>

        <select id="clock-mode">
            <option value="analog">アナログ</option>
            <option value="digital">デジタル</option>
            <option value="hybrid" selected>
                アナログ／デジタル
            </option>
        </select>

        <!-- 色変更 -->
        <h3>🎨 色変更</h3>

        <label for="color-target">変更する項目：</label>

        <select id="color-target">
            <option value="background">背景</option>
            <option value="text">文字</option>
            <option value="clock">時計の表示窓</option>
            <option value="timer">タイマー</option>
            <option value="alarm">アラーム</option>
            <option value="button">ボタン</option>
        </select>

        <input type="color" id="color-picker"
               value="#000000">

        <button id="color-apply">色を適用</button>

    </div>
</section>

<!-- 時計表示エリア -->
<div id="clock-display">

    <!-- アナログ時計 -->
    <div id="analog-clock" class="analog-clock">
        <span class="clock-number number-12">12</span>
        <span class="clock-number number-3">3</span>
        <span class="clock-number number-6">6</span>
        <span class="clock-number number-9">9</span>

        <div id="hour-hand" class="clock-hand hour-hand"></div>
        <div id="minute-hand" class="clock-hand minute-hand"></div>
        <div id="second-hand" class="clock-hand second-hand"></div>
        <div class="clock-center"></div>
    </div>

    <!-- デジタル時計 -->
    <div id="clock">00:00:00</div>

</div>

    <!-- =========================
         🌍 ワールドタイム
    ========================= -->

    <section id="world-time">

        <h2>🌍 ワールドタイム</h2>

        <div id="world-clocks"></div>

        <button id="more-world-time">＋ もっと表示</button>

        <div id="city-selector" hidden>

            <h3>都市を選択</h3>

            <select id="city-select">

                <option value="">
                    都市を選択してください
                </option>

                <option value="Europe/Paris">
                    パリ
                </option>

                <option value="Asia/Shanghai">
                    北京
                </option>

                <option value="Asia/Singapore">
                    シンガポール
                </option>

                <option value="Australia/Sydney">
                    シドニー
                </option>

                <option value="Asia/Dubai">
                    ドバイ
                </option>

                <option value="America/Los_Angeles">
                    ロサンゼルス
                </option>

                <option value="Asia/Seoul">
                    ソウル
                </option>

                <option value="Asia/Kolkata">
                    ニューデリー
                </option>

            </select>

            <button id="add-city">追加</button>

        </div>

    </section>


    <!-- =========================
         ⏱️ タイマー
    ========================= -->

    <section id="timer">

        <h2>⏱️ タイマー</h2>

        <div id="timer-display">
            00:00:00
        </div>

        <button id="timer-settings">
            ⚙️ 設定
        </button>

        <div id="timer-setting-panel" hidden>

            <p>時間を選択してください</p>

            <div class="timer-wheels">

                <div class="timer-unit">
                    <select id="timer-hours"></select>
                    <span>時間</span>
                </div>

                <span class="timer-colon">:</span>

                <div class="timer-unit">
                    <select id="timer-minutes"></select>
                    <span>分</span>
                </div>

                <span class="timer-colon">:</span>

                <div class="timer-unit">
                    <select id="timer-seconds"></select>
                    <span>秒</span>
                </div>

            </div>

            <button id="timer-confirm">
                決定
            </button>

        </div>

        <br>

        <button id="timer-start">
            ▶ スタート
        </button>

        <button id="timer-pause">
            ⏸ 一時停止
        </button>

        <button id="timer-reset">
            🔄 リセット
        </button>

    </section>


    <!-- =========================
         🔔 アラーム
    ========================= -->

    <section id="alarm">

        <h2>🔔 アラーム</h2>

        <div id="alarm-display">
            未設定
        </div>

        <button id="alarm-settings">
            ⚙️ 設定
        </button>

        <div id="alarm-setting-panel" hidden>

            <p>アラーム時刻を選択してください</p>

            <select id="alarm-hours"></select>
            :
            <select id="alarm-minutes"></select>

            <br>

            <button id="alarm-confirm">
                決定
            </button>

        </div>

        <button id="alarm-cancel">
            🔕 解除
        </button>

    </section>

<!-- =========================
     ⏱️ ストップウォッチ
========================= -->
<section id="stopwatch">
    <h2>⏱️ ストップウォッチ</h2>
    <div id="stopwatch-display">
        00:00:00.00
    </div>
    <div id="stopwatch-controls">
        <button id="stopwatch-start">
            ▶ スタート
        </button>
        <button id="stopwatch-stop">
            ⏸ ストップ
        </button>
        <button id="stopwatch-lap">
            🏁 ラップ
        </button>
        <button id="stopwatch-reset">
            🔄 リセット
        </button>
    </div>
    <!-- ラップタイム -->
    <div id="stopwatch-laps">
        <h3>ラップタイム</h3>
        <ol id="stopwatch-lap-list"></ol>
    </div>
</section>
<!-- =========================
     🌦️ 天気
========================= -->
<section id="weather">
    <h2>🌦️ 天気</h2>
    <div id="weather-display">
        天気情報を取得中...
    </div>
</section>
    <!-- =========================
         JavaScript
    ========================= -->

    <script src="js/clock.js"></script>
    <script src="js/worldtime.js"></script>
    <script src="js/SYSsound.js"></script>
    <script src="js/timer.js"></script>
    <script src="js/alarm.js"></script>
    <script src="js/stopwatch.js"></script>
    <script src="js/weather.js"></script>
</body>
</html>
