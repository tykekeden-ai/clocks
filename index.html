<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>時計</title>
</head>

<body>

    <h1>時計</h1>

    <div id="clock">00:00:00</div>
<section id="world-time">
    <h2>🌍 ワールドタイム</h2>

    <div id="world-clocks"></div>

    <button id="more-world-time">＋ もっと表示</button>

    <div id="city-selector" hidden>
        <h3>都市を選択</h3>
        <select id="city-select">
            <option value="">都市を選択してください</option>
            <option value="Europe/Paris">パリ</option>
            <option value="Asia/Shanghai">北京</option>
            <option value="Asia/Singapore">シンガポール</option>
            <option value="Australia/Sydney">シドニー</option>
            <option value="Asia/Dubai">ドバイ</option>
            <option value="America/Los_Angeles">ロサンゼルス</option>
            <option value="Asia/Seoul">ソウル</option>
            <option value="Asia/Kolkata">ニューデリー</option>
        </select>

        <button id="add-city">追加</button>
    </div>
</section>
<section id="timer">
    <h2>⏱️ タイマー</h2>

    <div id="timer-display">00:00:00</div>

    <button id="timer-settings">⚙️ 設定</button>

    <div id="timer-setting-panel" hidden>
        <p>時間を設定してください</p>

        <input id="timer-hours" type="number" min="0" value="0"> 時間
        <input id="timer-minutes" type="number" min="0" max="59" value="0"> 分
        <input id="timer-seconds" type="number" min="0" max="59" value="0"> 秒

        <br>

        <button id="timer-confirm">決定</button>
    </div>

    <br>

    <button id="timer-start">▶ スタート</button>
    <button id="timer-pause">⏸ 一時停止</button>
    <button id="timer-reset">🔄 リセット</button>
</section>

<script src="js/timer.js"></script>
<script src="js/clock.js"></script>
<script src="js/worldtime.js"></script>

</body>
</html>
