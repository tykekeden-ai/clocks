<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>時計</title>
<style>
.timer-wheels {
    display: flex !important;
    flex-direction: row !important;
    align-items: center;
    justify-content: center;
    gap: 5px;
}

.timer-unit {
    display: flex;
    flex-direction: column;
    align-items: center;
}

.timer-unit select {
    width: 60px;
    height: 35px;
    font-size: 18px;
}

.timer-unit span {
    font-size: 12px;
}

.timer-colon {
    font-size: 20px;
    margin-bottom: 18px;
}
</style>
</head>
<body>

    <h1>時計</h1>

    <div id="clock">00:00:00</div>
<section id="world-time">
    <h2>🌍 ワールドタイム</h2>

    <div id="world-clocks"></div>

    <button id="more-world-time">＋ もっと表示</button>

    <div id="city-selector" hidden>
        <h3>都市を選択</h3>
        <select id="city-select">
            <option value="">都市を選択してください</option>
            <option value="Europe/Paris">パリ</option>
            <option value="Asia/Shanghai">北京</option>
            <option value="Asia/Singapore">シンガポール</option>
            <option value="Australia/Sydney">シドニー</option>
            <option value="Asia/Dubai">ドバイ</option>
            <option value="America/Los_Angeles">ロサンゼルス</option>
            <option value="Asia/Seoul">ソウル</option>
            <option value="Asia/Kolkata">ニューデリー</option>
        </select>

        <button id="add-city">追加</button>
    </div>
</section>
<section id="timer">
    <h2>⏱️ タイマー</h2>

    <div id="timer-display">00:00:00</div>

    <button id="timer-settings">⚙️ 設定</button>

    <div id="timer-setting-panel" hidden>
        <p>時間を選択してください</p>
      <div class="timer-wheels">

    <div class="timer-unit">
        <select id="timer-hours"></select>
        <span>時間</span>
    </div>

    <span class="timer-colon">:</span>

    <div class="timer-unit">
        <select id="timer-minutes"></select>
        <span>分</span>
    </div>

    <span class="timer-colon">:</span>

    <div class="timer-unit">
        <select id="timer-seconds"></select>
        <span>秒</span>
    </div>

</div>  
        <button id="timer-confirm">決定</button>
    </div>

    <br>

    <button id="timer-start">▶ スタート</button>
    <button id="timer-pause">⏸ 一時停止</button>
    <button id="timer-reset">🔄 リセット</button>
    </section>
    <section id="alarm">
    <h2>🔔 アラーム</h2>

    <div id="alarm-display">未設定</div>

    <button id="alarm-settings">⚙️ 設定</button>

    <div id="alarm-setting-panel" hidden>
        <p>アラーム時刻を選択してください</p>

        <select id="alarm-hours"></select>
        :
        <select id="alarm-minutes"></select>

        <br>

        <button id="alarm-confirm">決定</button>
    </div>

    <button id="alarm-cancel">🔕 解除</button>
</section>
<script src="js/clock.js"></script>
<script src="js/worldtime.js"></script>
<script src="js/timer.js"></script>
<script src="js/alarm.js"></script>
</body>
</html>
